<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head>
<body>
  <div class="label-cap" style="margin-bottom:10px;">Violet — primary brand ramp</div>
  <div style="display:grid; grid-template-columns: repeat(11, 1fr); gap:6px;">
    <div class="col"><div class="swatch" style="background:var(--violet-50);"></div><span class="swatch-meta"><strong>50</strong></span></div>
    <div class="col"><div class="swatch" style="background:var(--violet-100);"></div><span class="swatch-meta"><strong>100</strong></span></div>
    <div class="col"><div class="swatch" style="background:var(--violet-200);"></div><span class="swatch-meta"><strong>200</strong></span></div>
    <div class="col"><div class="swatch" style="background:var(--violet-300);"></div><span class="swatch-meta"><strong>300</strong></span></div>
    <div class="col"><div class="swatch" style="background:var(--violet-400);"></div><span class="swatch-meta"><strong>400</strong></span></div>
    <div class="col"><div class="swatch" style="background:var(--violet-500);"></div><span class="swatch-meta"><strong>500</strong></span></div>
    <div class="col"><div class="swatch" style="background:var(--violet-600); outline:2px solid rgba(124,58,237,0.25); outline-offset:2px;"></div><span class="swatch-meta"><strong>600 ★</strong></span></div>
    <div class="col"><div class="swatch" style="background:var(--violet-700);"></div><span class="swatch-meta"><strong>700</strong></span></div>
    <div class="col"><div class="swatch" style="background:var(--violet-800);"></div><span class="swatch-meta"><strong>800</strong></span></div>
    <div class="col"><div class="swatch" style="background:var(--violet-900);"></div><span class="swatch-meta"><strong>900</strong></span></div>
    <div class="col"><div class="swatch" style="background:var(--violet-950);"></div><span class="swatch-meta"><strong>950 ★</strong></span></div>
  </div>
  <div class="muted" style="font-size:11px; margin-top:10px;">★ 600 = primary action · 950 = tutor sidebar</div>
</body></html>
