<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head>
<body style="background:var(--slate-50);">
  <div class="label-cap" style="margin-bottom:14px;">Elevation</div>
  <div style="display:grid; grid-template-columns: repeat(5, 1fr); gap:14px; padding:8px 4px 18px;">
    <div class="col">
      <div style="width:100px; height:70px; background:#fff; border-radius:14px; box-shadow:var(--shadow-sm);"></div>
      <span class="swatch-meta"><strong>sm</strong>cards at rest</span>
    </div>
    <div class="col">
      <div style="width:100px; height:70px; background:#fff; border-radius:14px; box-shadow:var(--shadow-md);"></div>
      <span class="swatch-meta"><strong>md</strong>card hover</span>
    </div>
    <div class="col">
      <div style="width:100px; height:70px; background:#fff; border-radius:14px; box-shadow:var(--shadow-lg);"></div>
      <span class="swatch-meta"><strong>lg</strong>popover</span>
    </div>
    <div class="col">
      <div style="width:100px; height:70px; background:#fff; border-radius:14px; box-shadow:var(--shadow-xl);"></div>
      <span class="swatch-meta"><strong>xl</strong>modal</span>
    </div>
    <div class="col">
      <div style="width:100px; height:70px; background:#fff; border-radius:14px; box-shadow:var(--shadow-violet-xl);"></div>
      <span class="swatch-meta"><strong>violet-xl ★</strong>hero CTA · login</span>
    </div>
  </div>
</body></html>
