<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head>
<body>
  <div class="label-cap" style="margin-bottom:12px;">Corner radii</div>
  <div style="display:grid; grid-template-columns: repeat(6, 1fr); gap:10px; align-items:end;">
    <div class="col"><div style="width:80px; height:60px; background:var(--violet-100); border:1.5px solid var(--violet-300); border-radius:6px;"></div><span class="swatch-meta"><strong>xs · 6</strong></span></div>
    <div class="col"><div style="width:80px; height:60px; background:var(--violet-100); border:1.5px solid var(--violet-300); border-radius:8px;"></div><span class="swatch-meta"><strong>sm · 8</strong>icon tiles</span></div>
    <div class="col"><div style="width:80px; height:60px; background:var(--violet-100); border:1.5px solid var(--violet-300); border-radius:12px;"></div><span class="swatch-meta"><strong>lg · 12 ★</strong>buttons, inputs</span></div>
    <div class="col"><div style="width:80px; height:60px; background:var(--violet-100); border:1.5px solid var(--violet-300); border-radius:16px;"></div><span class="swatch-meta"><strong>xl · 16 ★</strong>cards</span></div>
    <div class="col"><div style="width:80px; height:60px; background:var(--violet-100); border:1.5px solid var(--violet-300); border-radius:24px;"></div><span class="swatch-meta"><strong>2xl · 24 ★</strong>hero, login</span></div>
    <div class="col"><div style="width:80px; height:60px; background:var(--violet-100); border:1.5px solid var(--violet-300); border-radius:9999px;"></div><span class="swatch-meta"><strong>pill</strong>badges</span></div>
  </div>
</body></html>
