<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head>
<body>
  <div class="label-cap" style="margin-bottom:12px;">Mechanic colors — one hue per gamified activity</div>
  <div style="display:grid; grid-template-columns: repeat(5, 1fr); gap:10px;">
    <div style="border-radius:14px; padding:14px; background:var(--violet-100); border:1px solid var(--violet-200);">
      <div style="font-size:11px; font-weight:700; color:var(--violet-700);">🎯 Swipe</div>
      <div style="font-size:11px; color:var(--violet-700); opacity:0.7; margin-top:4px;" class="mono">violet-100/700</div>
    </div>
    <div style="border-radius:14px; padding:14px; background:var(--blue-100); border:1px solid #bfdbfe;">
      <div style="font-size:11px; font-weight:700; color:var(--blue-700);">💬 Debate</div>
      <div style="font-size:11px; color:var(--blue-700); opacity:0.7; margin-top:4px;" class="mono">blue-100/700</div>
    </div>
    <div style="border-radius:14px; padding:14px; background:var(--orange-100); border:1px solid #fed7aa;">
      <div style="font-size:11px; font-weight:700; color:var(--orange-700);">🎭 Roleplay</div>
      <div style="font-size:11px; color:var(--orange-700); opacity:0.7; margin-top:4px;" class="mono">orange-100/700</div>
    </div>
    <div style="border-radius:14px; padding:14px; background:var(--emerald-100); border:1px solid #a7f3d0;">
      <div style="font-size:11px; font-weight:700; color:var(--emerald-600);">📖 Story</div>
      <div style="font-size:11px; color:var(--emerald-600); opacity:0.7; margin-top:4px;" class="mono">emerald-100/600</div>
    </div>
    <div style="border-radius:14px; padding:14px; background:var(--amber-50); border:1px solid var(--amber-200);">
      <div style="font-size:11px; font-weight:700; color:var(--amber-700);">🎓 Lesson</div>
      <div style="font-size:11px; color:var(--amber-700); opacity:0.7; margin-top:4px;" class="mono">amber-50/700</div>
    </div>
  </div>
</body></html>
