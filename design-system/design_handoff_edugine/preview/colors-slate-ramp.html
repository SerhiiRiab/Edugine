<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head>
<body>
  <div class="label-cap" style="margin-bottom:10px;">Slate — neutrals (text, surfaces, borders)</div>
  <div style="display:grid; grid-template-columns: repeat(11, 1fr); gap:6px;">
    <div class="col"><div class="swatch" style="background:var(--slate-50);"></div><span class="swatch-meta"><strong>50</strong>app bg</span></div>
    <div class="col"><div class="swatch" style="background:var(--slate-100);"></div><span class="swatch-meta"><strong>100</strong>border</span></div>
    <div class="col"><div class="swatch" style="background:var(--slate-200);"></div><span class="swatch-meta"><strong>200</strong>input</span></div>
    <div class="col"><div class="swatch" style="background:var(--slate-300);"></div><span class="swatch-meta"><strong>300</strong>placeholder</span></div>
    <div class="col"><div class="swatch" style="background:var(--slate-400);"></div><span class="swatch-meta"><strong>400</strong>muted</span></div>
    <div class="col"><div class="swatch" style="background:var(--slate-500);"></div><span class="swatch-meta"><strong>500</strong>subtle</span></div>
    <div class="col"><div class="swatch" style="background:var(--slate-600);"></div><span class="swatch-meta"><strong>600</strong></span></div>
    <div class="col"><div class="swatch" style="background:var(--slate-700);"></div><span class="swatch-meta"><strong>700</strong>label</span></div>
    <div class="col"><div class="swatch" style="background:var(--slate-800);"></div><span class="swatch-meta"><strong>800</strong>body</span></div>
    <div class="col"><div class="swatch" style="background:var(--slate-900);"></div><span class="swatch-meta"><strong>900 ★</strong>player</span></div>
    <div class="col"><div class="swatch" style="background:var(--slate-950);"></div><span class="swatch-meta"><strong>950</strong></span></div>
  </div>
</body></html>
