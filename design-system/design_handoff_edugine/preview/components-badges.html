<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css">
<style>
  .badge { display:inline-flex; align-items:center; padding:3px 11px; border-radius:9999px; font-size:12px; font-weight:600; border:1px solid; line-height:1.4; }
  .pill-glass { display:inline-flex; align-items:center; gap:8px; padding:6px 16px; border-radius:9999px; background:rgba(255,255,255,0.10); backdrop-filter:blur(8px); border:1px solid rgba(255,255,255,0.20); color:rgba(255,255,255,0.85); font-size:13px; font-weight:500; }
</style>
</head>
<body>
  <div class="label-cap" style="margin-bottom:12px;">Mechanic badges</div>
  <div style="display:flex; flex-wrap:wrap; gap:8px; margin-bottom:16px;">
    <span class="badge" style="background:var(--violet-100); color:var(--violet-700); border-color:var(--violet-200);">Swipe Battle 🎯</span>
    <span class="badge" style="background:var(--blue-100); color:var(--blue-700); border-color:#bfdbfe;">Speed Debate 💬</span>
    <span class="badge" style="background:var(--orange-100); color:var(--orange-700); border-color:#fed7aa;">Roleplay Quest 🎭</span>
    <span class="badge" style="background:var(--emerald-100); color:#047857; border-color:#a7f3d0;">Group Story 📖</span>
    <span class="badge" style="background:var(--amber-50); color:var(--amber-700); border-color:var(--amber-200);">🎓 Lesson</span>
  </div>
  <div class="label-cap" style="margin-bottom:12px;">Glass pill (marketing) &amp; mono code</div>
  <div style="background:linear-gradient(135deg, var(--violet-500), var(--purple-600)); padding:14px; border-radius:14px; display:flex; gap:10px; flex-wrap:wrap;">
    <span class="pill-glass"><span style="width:8px; height:8px; border-radius:9999px; background:#4ade80;"></span>Now in beta — free for tutors</span>
    <span style="font-family:var(--font-mono); background:rgba(15,23,42,0.8); color:#a78bfa; padding:6px 14px; border-radius:9999px; font-weight:700; letter-spacing:0.05em;">M3K9P2</span>
  </div>
</body></html>
