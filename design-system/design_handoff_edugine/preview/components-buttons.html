<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css">
<style>
  .btn { font-family:var(--font-sans); font-weight:600; border-radius:12px; padding:10px 18px; font-size:14px; border:0; cursor:pointer; transition:all 150ms; display:inline-flex; align-items:center; gap:6px; }
  .btn-primary { background:var(--violet-600); color:#fff; }
  .btn-primary:hover { background:var(--violet-700); }
  .btn-lg { padding:14px 28px; font-size:16px; border-radius:14px; font-weight:700; box-shadow:var(--shadow-violet-md); }
  .btn-on-grad { background:#fff; color:var(--violet-700); font-weight:700; }
  .btn-outline { background:transparent; color:var(--violet-600); border:2px solid var(--violet-200); }
  .btn-ghost-dark { background:transparent; color:rgba(255,255,255,0.9); }
  .btn-glass { background:rgba(255,255,255,0.10); backdrop-filter:blur(8px); border:1px solid rgba(255,255,255,0.20); color:#fff; font-weight:700; }
</style>
</head>
<body>
  <div class="label-cap" style="margin-bottom:14px;">Buttons — light surface</div>
  <div style="display:flex; gap:12px; align-items:center; margin-bottom:18px;">
    <button class="btn btn-primary">Sign in →</button>
    <button class="btn btn-outline">Send magic link ✨</button>
    <button class="btn" style="background:var(--slate-100); color:var(--slate-700);">Cancel</button>
    <button class="btn" style="background:transparent; color:var(--red-500); padding:10px 12px;">Delete</button>
  </div>
  <div class="label-cap" style="margin-bottom:14px;">Buttons — on gradient (marketing) &amp; large hero CTA</div>
  <div style="background:linear-gradient(135deg, var(--violet-500), var(--purple-600), var(--indigo-700)); padding:18px; border-radius:14px; display:flex; gap:12px; align-items:center;">
    <button class="btn btn-lg btn-on-grad">Get started for free ✨</button>
    <button class="btn btn-glass">Sign in</button>
  </div>
</body></html>
