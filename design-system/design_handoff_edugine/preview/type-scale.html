<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head>
<body>
  <div style="display:flex; flex-direction:column; gap:14px; padding:6px;">
    <div style="display:flex; align-items:baseline; gap:16px;">
      <div style="font-weight:700; font-size:18px; min-width:200px;">Section heading</div>
      <span class="muted mono" style="font-size:11px;">h4 · 18 / 700</span>
    </div>
    <div style="display:flex; align-items:baseline; gap:16px;">
      <div style="font-weight:400; font-size:16px; line-height:1.6; color:var(--fg); max-width:340px;">Body copy sits at 16px with relaxed leading. Talks to you like a peer.</div>
      <span class="muted mono" style="font-size:11px;">body · 16 / 400</span>
    </div>
    <div style="display:flex; align-items:baseline; gap:16px;">
      <div style="font-weight:400; font-size:14px; color:var(--slate-500); max-width:340px;">Ready to teach something awesome today?</div>
      <span class="muted mono" style="font-size:11px;">body-sm · 14 / slate-500</span>
    </div>
    <div style="display:flex; align-items:baseline; gap:16px;">
      <div style="font-weight:500; font-size:14px; color:var(--slate-700);">Email address</div>
      <span class="muted mono" style="font-size:11px;">label · 14 / 500</span>
    </div>
    <div style="display:flex; align-items:baseline; gap:16px;">
      <div style="font-weight:600; font-size:11px; letter-spacing:0.06em; text-transform:uppercase; color:var(--fg-muted);">In this room (3)</div>
      <span class="muted mono" style="font-size:11px;">caption · 11 / 600 / uppercase</span>
    </div>
  </div>
</body></html>
