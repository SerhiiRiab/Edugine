<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head>
<body>
  <div style="display:grid; grid-template-columns: 1.4fr 1fr; gap:16px; padding:6px;">
    <div style="height:170px; border-radius:18px; background:linear-gradient(135deg, var(--violet-500) 0%, var(--purple-600) 50%, var(--indigo-700) 100%); display:flex; flex-direction:column; justify-content:space-between; padding:14px 16px; color:#fff;">
      <span style="font-size:11px; opacity:0.8; letter-spacing:0.04em; text-transform:uppercase;">Marketing &amp; Auth</span>
      <div>
        <div style="font-weight:800; font-size:22px; letter-spacing:-0.02em;">Hero gradient</div>
        <div class="mono" style="font-size:11px; opacity:0.8; margin-top:4px;">from-violet-500 → via-purple-600 → to-indigo-700</div>
      </div>
    </div>
    <div style="height:170px; border-radius:18px; background:linear-gradient(90deg, var(--violet-500), var(--purple-600)); display:flex; flex-direction:column; justify-content:space-between; padding:14px 16px; color:#fff; position:relative; overflow:hidden;">
      <div style="position:absolute; top:-30px; right:-30px; width:90px; height:90px; background:rgba(255,255,255,0.10); border-radius:9999px;"></div>
      <div style="position:absolute; bottom:-40px; right:70px; width:70px; height:70px; background:rgba(255,255,255,0.10); border-radius:9999px;"></div>
      <span style="font-size:11px; opacity:0.85; letter-spacing:0.04em; text-transform:uppercase; position:relative;">In-app CTA</span>
      <div style="position:relative;">
        <div style="font-weight:800; font-size:18px;">Dashboard banner</div>
        <div class="mono" style="font-size:11px; opacity:0.85; margin-top:4px;">violet-500 → purple-600 + blobs</div>
      </div>
    </div>
  </div>
</body></html>
