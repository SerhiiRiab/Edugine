<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head>
<body>
  <div class="label-cap" style="margin-bottom:12px;">Surfaces — three themes</div>
  <div style="display:grid; grid-template-columns: 1fr 1fr 1fr; gap:10px;">
    <div style="height:150px; border-radius:14px; background:linear-gradient(135deg, var(--violet-500), var(--purple-600), var(--indigo-700)); padding:12px; color:#fff; display:flex; flex-direction:column; justify-content:space-between;">
      <span style="font-size:10px; letter-spacing:0.04em; text-transform:uppercase; opacity:0.85;">Marketing</span>
      <div>
        <div style="font-weight:800; font-size:15px;">Sign up →</div>
        <div class="mono" style="font-size:10px; opacity:0.8; margin-top:2px;">gradient + white type</div>
      </div>
    </div>
    <div style="height:150px; border-radius:14px; background:var(--slate-50); padding:12px; border:1px solid var(--slate-100); display:flex; flex-direction:column; justify-content:space-between;">
      <span style="font-size:10px; letter-spacing:0.04em; text-transform:uppercase; color:var(--fg-muted); font-weight:600;">Tutor app</span>
      <div>
        <div style="background:#fff; border:2px solid var(--slate-100); border-radius:10px; padding:8px; box-shadow:var(--shadow-sm);">
          <div style="font-weight:700; font-size:12px; color:var(--slate-800);">Content set</div>
          <div style="font-size:10px; color:var(--slate-400);">12 cards · 3h ago</div>
        </div>
        <div class="mono" style="font-size:10px; color:var(--fg-muted); margin-top:6px;">slate-50 + violet-950 sidebar</div>
      </div>
    </div>
    <div style="height:150px; border-radius:14px; background:var(--slate-900); padding:12px; color:#fff; display:flex; flex-direction:column; justify-content:space-between;">
      <span style="font-size:10px; letter-spacing:0.04em; text-transform:uppercase; color:var(--slate-400); font-weight:600;">Player</span>
      <div>
        <div style="background:var(--slate-800); border-radius:10px; padding:8px;">
          <div style="font-weight:700; font-size:12px;">⏳ Waiting…</div>
          <div style="font-size:10px; color:var(--slate-400);">M3K9P2 · 3 in room</div>
        </div>
        <div class="mono" style="font-size:10px; color:var(--slate-400); margin-top:6px;">slate-900 + violet accent</div>
      </div>
    </div>
  </div>
</body></html>
