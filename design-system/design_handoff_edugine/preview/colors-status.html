<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head>
<body>
  <div class="label-cap" style="margin-bottom:12px;">Status & feedback</div>
  <div style="display:grid; grid-template-columns: repeat(4, 1fr); gap:10px;">
    <div style="border-radius:12px; background:#ecfdf5; border:1px solid #a7f3d0; padding:14px;">
      <div style="width:24px; height:24px; border-radius:9999px; background:var(--emerald-500); display:flex; align-items:center; justify-content:center; color:#fff; font-weight:700; font-size:14px;">✓</div>
      <div style="font-weight:700; font-size:13px; color:var(--emerald-600); margin-top:8px;">Success</div>
      <div class="mono" style="font-size:10px; color:var(--emerald-600); opacity:0.7; margin-top:2px;">emerald-500</div>
    </div>
    <div style="border-radius:12px; background:var(--amber-50); border:1px solid var(--amber-200); padding:14px;">
      <div style="width:24px; height:24px; border-radius:9999px; background:var(--amber-500); display:flex; align-items:center; justify-content:center; color:#fff; font-weight:700; font-size:14px;">!</div>
      <div style="font-weight:700; font-size:13px; color:var(--amber-700); margin-top:8px;">Warning</div>
      <div class="mono" style="font-size:10px; color:var(--amber-700); opacity:0.7; margin-top:2px;">amber-500</div>
    </div>
    <div style="border-radius:12px; background:var(--red-50); border:1px solid #fecaca; padding:14px;">
      <div style="width:24px; height:24px; border-radius:9999px; background:var(--red-500); display:flex; align-items:center; justify-content:center; color:#fff; font-weight:700; font-size:14px;">×</div>
      <div style="font-weight:700; font-size:13px; color:#b91c1c; margin-top:8px;">Danger</div>
      <div class="mono" style="font-size:10px; color:#b91c1c; opacity:0.7; margin-top:2px;">red-500</div>
    </div>
    <div style="border-radius:12px; background:#f0f9ff; border:1px solid #bae6fd; padding:14px;">
      <div style="width:24px; height:24px; border-radius:9999px; background:var(--sky-500); display:flex; align-items:center; justify-content:center; color:#fff; font-weight:700; font-size:14px;">i</div>
      <div style="font-weight:700; font-size:13px; color:#0369a1; margin-top:8px;">Info</div>
      <div class="mono" style="font-size:10px; color:#0369a1; opacity:0.7; margin-top:2px;">sky-500</div>
    </div>
  </div>
</body></html>
