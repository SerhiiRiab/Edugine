<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head>
<body style="background:var(--slate-900); padding:18px;">
  <div style="color:var(--slate-400); font-size:11px; font-weight:600; letter-spacing:0.06em; text-transform:uppercase; margin-bottom:14px;">Player result panels (dark)</div>
  <div style="display:grid; grid-template-columns: repeat(3, 1fr); gap:12px;">
    <div style="background:rgba(16,185,129,0.10); border:1px solid rgba(16,185,129,0.20); border-radius:14px; padding:14px; text-align:center;">
      <div style="font-weight:900; font-size:28px; color:#34d399; letter-spacing:-0.01em;">8</div>
      <div style="font-size:11px; color:#10b981; margin-top:4px; font-weight:500;">Correct</div>
    </div>
    <div style="background:rgba(239,68,68,0.10); border:1px solid rgba(239,68,68,0.20); border-radius:14px; padding:14px; text-align:center;">
      <div style="font-weight:900; font-size:28px; color:#f87171; letter-spacing:-0.01em;">2</div>
      <div style="font-size:11px; color:#f87171; margin-top:4px; font-weight:500;">Wrong</div>
    </div>
    <div style="background:rgba(139,92,246,0.10); border:1px solid rgba(139,92,246,0.20); border-radius:14px; padding:14px; text-align:center;">
      <div style="font-weight:900; font-size:28px; color:#a78bfa; letter-spacing:-0.01em;">80%</div>
      <div style="font-size:11px; color:#a78bfa; margin-top:4px; font-weight:500;">Accuracy</div>
    </div>
  </div>
  <div style="font-family:var(--font-mono); font-size:10px; color:var(--slate-500); margin-top:10px;">{color}-500/10 background · {color}-500/20 border · {color}-400 number</div>
</body></html>
