<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head>
<body style="padding:0;">
  <div style="display:flex; gap:14px; padding:20px; align-items:center;">
    <!-- Marketing tile — wordmark only on the gradient -->
    <div style="flex:1; height:130px; border-radius:16px; background:linear-gradient(135deg, var(--violet-500), var(--purple-600), var(--indigo-700)); display:flex; align-items:center; justify-content:center;">
      <span style="color:#fff; font-weight:800; letter-spacing:-0.025em; font-size:24px;">Edugine</span>
    </div>
    <!-- Tutor sidebar tile -->
    <div style="flex:1; height:130px; border-radius:16px; background:var(--violet-950); display:flex; align-items:center; justify-content:center;">
      <div style="display:flex; align-items:center; gap:10px; color:#fff;">
        <img src="../assets/edugine-mark.svg" alt="" style="width:32px; height:32px;">
        <span style="font-weight:800; letter-spacing:-0.02em; font-size:18px;">Edugine</span>
      </div>
    </div>
    <!-- Player tile -->
    <div style="flex:1; height:130px; border-radius:16px; background:var(--slate-900); display:flex; align-items:center; justify-content:center;">
      <img src="../assets/edugine-mark.svg" alt="" style="height:80px;">
    </div>
  </div>
</body></html>
