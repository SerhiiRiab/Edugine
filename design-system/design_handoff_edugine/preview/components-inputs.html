<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head>
<body>
  <div class="label-cap" style="margin-bottom:14px;">Form inputs</div>
  <div style="display:grid; grid-template-columns: 1fr 1fr; gap:18px;">
    <div>
      <label style="display:block; font-size:14px; font-weight:500; color:var(--slate-700); margin-bottom:6px;">Email address</label>
      <input type="text" value="teacher@school.com" style="width:100%; padding:12px 16px; border-radius:12px; border:1px solid var(--slate-200); font-family:var(--font-sans); font-size:14px; color:var(--slate-800); outline:none;">
    </div>
    <div>
      <label style="display:block; font-size:14px; font-weight:500; color:var(--slate-700); margin-bottom:6px;">Password</label>
      <div style="position:relative;">
        <input type="text" value="••••••••" style="width:100%; padding:12px 44px 12px 16px; border-radius:12px; border:1px solid var(--violet-500); font-family:var(--font-sans); font-size:14px; color:var(--slate-800); outline:none; box-shadow:0 0 0 3px var(--focus-ring);">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="var(--slate-400)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="position:absolute; right:12px; top:50%; transform:translateY(-50%);"><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>
      </div>
    </div>
  </div>
  <div class="muted mono" style="font-size:11px; margin-top:14px;">px-4 py-3 · rounded-xl · border-slate-200 · focus ring violet-500/20</div>
</body></html>
