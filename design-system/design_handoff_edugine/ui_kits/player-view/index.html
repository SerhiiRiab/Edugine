<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Edugine — Player View UI Kit</title>
  <link rel="stylesheet" href="../../colors_and_type.css">
  <style>
    html, body { margin: 0; padding: 0; }
    body {
      font-family: var(--font-sans);
      background: #1a1f2e;
      display: flex; align-items: center; justify-content: center;
      min-height: 100vh; padding: 24px;
    }
    .phone {
      width: 380px; max-width: 100%; height: 760px; max-height: 90vh;
      background: var(--slate-900); color: #fff;
      border-radius: 36px;
      box-shadow: 0 24px 56px -8px rgba(0,0,0,0.5), 0 0 0 8px #0f1320;
      overflow: hidden; display: flex; flex-direction: column;
      position: relative;
    }
    /* fake status bar */
    .status-bar {
      height: 36px; display: flex; align-items: center; justify-content: space-between;
      padding: 0 24px; font-size: 13px; font-weight: 600; color: #fff; flex-shrink: 0;
    }
    .kit-toolbar {
      position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
      background: rgba(15, 23, 42, 0.85); backdrop-filter: blur(12px);
      color: #fff; border-radius: 9999px; padding: 6px; display: flex; gap: 4px;
      z-index: 100; box-shadow: 0 12px 32px -4px rgba(0,0,0,0.4);
    }
    .kit-tab {
      padding: 8px 16px; border-radius: 9999px; font-size: 12px; font-weight: 600;
      cursor: pointer; color: rgba(255,255,255,0.7); transition: all 200ms;
      background: transparent; border: 0; font-family: var(--font-sans);
    }
    .kit-tab:hover { color: #fff; }
    .kit-tab.active { background: var(--violet-600); color: #fff; }
  </style>
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel" src="../_shared/icons.jsx"></script>
  <script type="text/babel" src="./NicknameScreen.jsx"></script>
  <script type="text/babel" src="./WaitingRoom.jsx"></script>
  <script type="text/babel" src="./SwipeBattle.jsx"></script>
  <script type="text/babel" src="./ResultScreen.jsx"></script>

  <script type="text/babel">
    function App() {
      const [phase, setPhase] = React.useState('nickname');
      const [nickname, setNickname] = React.useState('');
      const [result, setResult] = React.useState(null);

      const Nick = window.PlayerNicknameScreen;
      const Waiting = window.PlayerWaitingRoom;
      const Game = window.PlayerSwipeBattle;
      const Result = window.PlayerResultScreen;

      return (
        <>
          <div className="phone">
            {/* status bar */}
            <div className="status-bar">
              <span>9:41</span>
              <span style={{display:'flex', gap:6, alignItems:'center'}}>
                <span style={{fontSize:11}}>●●●●</span>
                <span>📶</span>
                <span style={{
                  width:24, height:11, border:'1px solid rgba(255,255,255,0.7)',
                  borderRadius:3, padding:1, display:'inline-flex'
                }}><span style={{flex:1, background:'#fff', borderRadius:1}}/></span>
              </span>
            </div>
            {phase === 'nickname' && <Nick onJoin={n => { setNickname(n); setPhase('waiting'); }}/>}
            {phase === 'waiting'  && <Waiting me={nickname || 'Alex'} onStart={() => setPhase('playing')}/>}
            {phase === 'playing'  && <Game onFinish={r => { setResult(r); setPhase('finished'); }}/>}
            {phase === 'finished' && <Result result={result || { correct: 4, total: 5, score: 80 }} onReset={() => setPhase('nickname')}/>}
          </div>

          <div className="kit-toolbar">
            <button className={`kit-tab ${phase==='nickname'?'active':''}`} onClick={()=>setPhase('nickname')}>Join</button>
            <button className={`kit-tab ${phase==='waiting'?'active':''}`}  onClick={()=>setPhase('waiting')}>Waiting</button>
            <button className={`kit-tab ${phase==='playing'?'active':''}`}  onClick={()=>setPhase('playing')}>Game</button>
            <button className={`kit-tab ${phase==='finished'?'active':''}`} onClick={()=>{ setResult({correct: 4, total: 5, score: 80}); setPhase('finished'); }}>Result</button>
          </div>
        </>
      );
    }
    ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
  </script>
</body>
</html>
